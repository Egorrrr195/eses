function flash(msg, kind){
  const el = document.getElementById("flashAlert");
  el.textContent = msg;
  el.className = "alert alert-" + (kind === "danger" ? "danger" : "info") + " py-2 mt-3";
  el.style.display = "block";
  setTimeout(()=>{ el.style.display = "none"; }, 4000);
}

function get_csrf(){
  const m = document.cookie.match(/_csrf=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}

function set_csrf(v){
  document.cookie = "_csrf=" + encodeURIComponent(v) + "; path=/";
}

/* ---------- простой редирект ---------- */
function redirectTo(hash){
  if(hash.startsWith("#")) location.hash = hash;
  else location.hash = "#" + hash;
}

function postForm(form){
  const data = new FormData(form);
  const csrf = form.querySelector('input[name="_csrf"]');
  if(csrf) data.set("_csrf", csrf.value);
  const url = form.action || (API_BASE + location.hash.replace("#",""));
  fetch(url, { method:"POST", body:data })
    .then(r=>r.json().catch(()=>({ flash:"Сохранено" })))
    .then(j=>{
      if(j && j.error){ flash(j.error, "danger"); }
      else if(j && j.flash){ flash(j.flash, "info"); }
      else { flash("Сохранено"); }
      if(j && j.redirect){ redirectTo(j.redirect); return; }
      loadState();
    })
    .catch(()=>flash("Ошибка сети", "danger"));
  return false;
}

async function loadState(){
  try{
    const r = await fetch(API_BASE + "/");
    if(!r.ok){
      const j = await r.json().catch(()=>({}));
      if(j && j.redirect){ redirectTo(j.redirect); return; }
      flash("Не удалось загрузить данные", "danger");
      return;
    }
    const j = await r.json();
    if(j.csrf) set_csrf(j.csrf);
    state = j;
    showSectionFromHash();
  }catch(e){
    flash("Ошибка загрузки: " + e.message, "danger");
  }
}

function showSectionFromHash(){
  const h = location.hash.replace(/^#/,"") || "index";
  const parts = h.split("/").filter(Boolean);
  let name = parts[0] || "index";
  let payload = null;

  if(name === "user" && parts[1]){
    payload = (state.users || []).find(u => String(u.id) === parts[1]) || null;
    if(!payload){
      flash("Пользователь не найден", "danger");
      payload = { name:"Не найден", id:parts[1], balance:0, created:"-", };
    }
  }
  if(name === "orders" && parts[1]){
    state.orderStatus = parts[1];
  }else{
    state.orderStatus = null;
  }
  if(name === "users" && document.getElementById("userQ")){
    state.userQuery = document.getElementById("userQ").value;
  }
  showSection(name, payload);
}

function filterUsers(){
  const q = (document.getElementById("userQ").value || "").trim().toLowerCase();
  if(!q){
    state.userQuery = "";
    showSectionFromHash();
    return;
  }
  state.users = (state.users || []).filter(u =>
    String(u.id).includes(q) || (u.name||"").toLowerCase().includes(q)
  );
  showSectionFromHash();
}

function editStateRaw(){
  const body = document.getElementById("contentBody");
  body.innerHTML = `
<h4 class="mb-3">Данные (JSON)</h4>
<pre class="mb-3" style="max-height:60vh;overflow:auto">${escapeHtml(JSON.stringify(state, null, 2))}</pre>
<div class="text-secondary small">Для реального редактирования лучше использовать api.py.</div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

window.addEventListener("hashchange", showSectionFromHash);

(async ()=>{
  await loadState();
})();
</script>
</body>
</html>
