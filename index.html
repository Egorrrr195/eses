<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ — Grand SAMP shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#12140f}
.card{background:#1d2018}
.navbar{background:#232719!important}
#flashAlert{display:none}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-3">
<div class="container-fluid">
<a class="navbar-brand" href="#/">⚙️ Grand SAMP shop</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#n"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="n">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link" href="#/">📊 Главная</a></li>
<li class="nav-item"><a class="nav-link" href="#/users">👥 Пользователи</a></li>
<li class="nav-item"><a class="nav-link" href="#/orders">🧾 Заказы</a></li>
<li class="nav-item"><a class="nav-link" href="#/categories">📖 Категории</a></li>
<li class="nav-item"><a class="nav-link" href="#/products">🛒 Товары</a></li>
<li class="nav-item"><a class="nav-link" href="#/coupons">🎟 Купоны</a></li>
<li class="nav-item"><a class="nav-link" href="#/topups">💰 Пополнения</a></li>
<li class="nav-item"><a class="nav-link" href="#/broadcast">📢 Рассылка</a></li>
<li class="nav-item"><a class="nav-link" href="#/settings">⚙️ Настройки</a></li>
</ul>
<a class="btn btn-sm btn-outline-secondary" href="#/login">Выйти</a>
</div>
</div>
</nav>
<div class="container-fluid pb-5">
<div id="flashAlert" class="alert alert-info py-2"></div>
<div id="content"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ---------- простой роутер и выполнение форм через fetch ---------- */
const API_BASE = "/api";

function flash(msg, kind){
  const el = document.getElementById("flashAlert");
  el.textContent = msg;
  el.className = "alert alert-" + (kind === "danger" ? "danger" : "info") + " py-2";
  el.style.display = "block";
  setTimeout(()=>{ el.style.display = "none"; }, 4000);
}

function postForm(form, redirect){
  const data = new FormData(form);
  const csrf = form.querySelector('input[name="_csrf"]');
  if(csrf) data.set("_csrf", csrf.value);
  fetch(form.action, { method:"POST", body:data })
    .then(r=>r.json())
    .then(j=>{
      if(j && j.error){ flash(j.error, "danger"); }
      else if(j && j.flash){ flash(j.flash, "info"); }
      else { flash("Сохранено"); }
      if(redirect){ setTimeout(()=>location.href=redirect, 600); }
      else { location.reload(); }
    })
    .catch(()=>flash("Ошибка сети", "danger"));
  return false;
}

function csrfToken(){
  const m = document.cookie.match(/_csrf=([^;]+)/);
  return m ? m[1] : "";
}

/* ---------- шаблоны страниц ---------- */
function tmplLogin(csrf){
  return `
<form method="post" action="${API_BASE}/login" class="card p-4" style="width:320px;background:#1d2018;margin:0 auto">
<h4 class="mb-3 text-center">🔐 Админ-панель</h4>
<input type="hidden" name="_csrf" value="${csrf}">
<input type="password" name="password" class="form-control mb-3" placeholder="Пароль" autofocus required>
<button class="btn btn-success w-100">Войти</button>
</form>`;
}
function tmplIndex(s, recent, STATUS){
  const recentRows = recent.map(o=>`
<tr>
<td>${o.id}</td>
<td><a href="#/users/${o.user_id}">${o.name || o.user_id}</a></td>
<td>${o.product}</td>
<td>${o.price}⭐</td>
<td>${o.date}</td>
<td>${STATUS[o.status] || o.status}</td>
</tr>`).join("");
  return `
<h4>📊 Статистика</h4>
<div class="row g-3 mb-4">
<div class="col-6 col-md-4 col-xl-2"><div class="card p-3"><div class="text-secondary small">Пользователей</div><div class="fs-3">${s.users}</div></div></div>
<div class="col-6 col-md-4 col-xl-2"><div class="card p-3"><div class="text-secondary small">Заказов всего</div><div class="fs-3">${s.orders}</div></div></div>
<div class="col-6 col-md-4 col-xl-2"><div class="card p-3"><div class="text-secondary small">Новых заказов</div><div class="fs-3">${s.new}</div></div></div>
<div class="col-6 col-md-4 col-xl-2"><div class="card p-3"><div class="text-secondary small">Выручка, ⭐</div><div class="fs-3">${s.revenue}</div></div></div>
<div class="col-6 col-md-4 col-xl-2"><div class="card p-3"><div class="text-secondary small">Пополнений, ⭐</div><div class="fs-3">${s.topups}</div></div></div>
<div class="col-6 col-md-4 col-xl-2"><div class="card p-3"><div class="text-secondary small">Балансы юзеров, ⭐</div><div class="fs-3">${s.balances}</div></div></div>
</div>
<h5>Последние заказы</h5>
<div class="table-responsive">
<table class="table table-sm align-middle">
<tr><th>#</th><th>Клиент</th><th>Товар</th><th>Цена</th><th>Дата</th><th>Статус</th></tr>
${recentRows}
</table>
</div>`;
}
function tmplUsers(rows, term){
  const rowsHtml = rows.map(u=>`
<tr>
<td>${u.id}</td>
<td>${u.name}</td>
<td>${u.balance}⭐</td>
<td>${u.created}</td>
<td><a class="btn btn-sm btn-outline-success" href="#/users/${u.id}">Открыть</a></td>
</tr>`).join("");
  return `
<h4>👥 Пользователи</h4>
<form class="row g-2 mb-3" onsubmit="return false">
<div class="col-auto"><input id="userQ" value="${term}" class="form-control" placeholder="ID или имя"></div>
<div class="col-auto"><button class="btn btn-secondary" onclick="loadUsers()">Найти</button></div>
</form>
<div class="table-responsive">
<table class="table table-sm align-middle">
<tr><th>ID</th><th>Имя</th><th>Баланс</th><th>Регистрация</th><th></th></tr>
${rowsHtml}
</table>
</div>`;
}
function tmplUser(u, orders, topups, refs, csrf){
  const ordersHtml = orders.map(o=>`
<tr>
<td>#${o.id}</td>
<td>${o.product}</td>
<td>${o.price}⭐</td>
<td>${o.date}</td>
<td>${STATUS[o.status] || o.status}</td>
</tr>`).join("");
  const topupsHtml = topups.map(t=>`
<tr>
<td>+${t.amount}⭐</td>
<td>${t.date}</td>
</tr>`).join("");
  return `
<h4>👤 ${u.name} <small class="text-secondary">ID ${u.id}</small></h4>
<p>Баланс: <b>${u.balance}⭐</b> · Регистрация: ${u.created} · Рефералов: ${refs}</p>
<div class="row g-3">
<div class="col-lg-4"><div class="card p-3">
<h6>💰 Баланс</h6>
<form onsubmit="return postForm(this)">
<input type="hidden" name="_csrf" value="${csrf}">
<input type="number" name="amount" class="form-control mb-2" placeholder="Сумма (минус = списать)" required>
<select name="mode" class="form-select mb-2">
<option value="add">Начислить / списать</option>
<option value="set">Установить точно</option>
</select>
<div class="form-check mb-2">
<input class="form-check-input" type="checkbox" name="notify" value="1" checked id="n1">
<label class="form-check-label" for="n1">Уведомить в боте</label>
</div>
<button class="btn btn-success w-100">Применить</button>
</form>
</div></div>
<div class="col-lg-4"><div class="card p-3">
<h6>🎁 Выдать товар бесплатно</h6>
<form onsubmit="return postForm(this)">
<input type="hidden" name="_csrf" value="${csrf}">
<input type="number" name="product_id" class="form-control mb-2" placeholder="ID товара (см. раздел Товары)" required>
<div class="form-check mb-2">
<input class="form-check-input" type="checkbox" name="notify" value="1" checked id="n2">
<label class="form-check-label" for="n2">Уведомить в боте</label>
</div>
<button class="btn btn-success w-100">Выдать</button>
</form>
</div></div>
<div class="col-lg-4"><div class="card p-3">
<h6>✉️ Сообщение в бота</h6>
<form onsubmit="return postForm(this)">
<input type="hidden" name="_csrf" value="${csrf}">
<textarea name="text" class="form-control mb-2" rows="3" required></textarea>
<button class="btn btn-success w-100">Отправить</button>
</form>
</div></div>
</div>
<div class="row g-3 mt-1">
<div class="col-lg-6"><div class="card p-3">
<h6>Имя</h6>
<form onsubmit="return postForm(this)" class="d-flex gap-2">
<input type="hidden" name="_csrf" value="${csrf}">
<input name="name" value="${u.name}" class="form-control">
<button class="btn btn-secondary">Сохранить</button>
</form>
<form onsubmit="return postForm(this)" class="mt-3">
<input type="hidden" name="_csrf" value="${csrf}">
<button class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить пользователя?')">Удалить пользователя</button>
</form>
</div></div>
</div>
<h5 class="mt-4">Заказы</h5>
<table class="table table-sm">
${ordersHtml}
</table>
<h5>Пополнения</h5>
<table class="table table-sm">
${topupsHtml}
</table>`;
}
function tmplOrders(rows, st, STATUS, csrf){
  const statusBtns = Object.entries(STATUS).map(([k,v])=>`
<a class="btn btn-sm btn-outline-secondary ${st===k?'active':''}" href="#/orders${k?'/?status='+k:''}">${v}</a>`).join("");
  const rowsHtml = rows.map(o=>`
<tr>
<td>${o.id}</td>
<td><a href="#/users/${o.user_id}">${o.name || o.user_id}</a></td>
<td>${o.product}</td>
<td>${o.price}⭐</td>
<td>${o.date}</td>
<td>${STATUS[o.status] || o.status}</td>
<td class="text-nowrap">
${o.status==='new' ? `<form onsubmit="return postForm(this)"><input type="hidden" name="_csrf" value="${csrf}"><button class="btn btn-sm btn-success">Выдать</button></form>` : ''}
${o.status!=='refunded' ? `<form onsubmit="return postForm(this)"><input type="hidden" name="_csrf" value="${csrf}"><button class="btn btn-sm btn-warning" onclick="return confirm('Вернуть деньги?')">Возврат</button></form>` : ''}
<form onsubmit="return postForm(this)">
<input type="hidden" name="_csrf" value="${csrf}">
<button class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить запись?')">✕</button>
</form>
</td>
</tr>`).join("");
  return `
<h4>🧾 Заказы</h4>
<div class="mb-3 btn-group">
<a class="btn btn-sm btn-outline-secondary ${!st?'active':''}" href="#/orders">Все</a>
${statusBtns}
</div>
<div class="table-responsive">
<table class="table table-sm align-middle">
<tr><th>#</th><th>Клиент</th><th>Товар</th><th>Цена</th><th>Дата</th><th>Статус</th><th>Действия</th></tr>
${rowsHtml}
</table>
</div>`;
}
function tmplCategories(rows, csrf){
  const rowsHtml = rows.map(c=>`
<tr>
<td>${c.id}</td>
<td>
<form onsubmit="return postForm(this)" class="d-flex gap-2">
<input type="hidden" name="_csrf" value="${csrf}">
<input name="name" value="${c.name}" class="form-control form-control-sm">
<button class="btn btn-sm btn-secondary">OK</button>
</form>
</td>
<td>${c.cnt}</td>
<td>
<form onsubmit="return postForm(this)">
<input type="hidden" name="_csrf" value="${csrf}">
<button class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить категорию вместе с товарами?')">Удалить</button>
</form>
</td>
</tr>`).join("");
  return `
<h4>📖 Категории</h4>
<form onsubmit="return postForm(this)" class="row g-2 mb-3">
<input type="hidden" name="_csrf" value="${csrf}">
<div class="col-auto"><input name="name" class="form-control" placeholder="Новая категория" required></div>
<div class="col-auto"><button class="btn btn-success">Добавить</button></div>
</form>
<table class="table align-middle">
<tr><th>ID</th><th>Название</th><th>Товаров</th><th></th></tr>
${rowsHtml}
</table>`;
}
function tmplProducts(rows, cats, csrf){
  const catsOpt = cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");
  const rowsHtml = rows.map(p=>`
<tr>
<td>${p.id}</td>
<td>
<select form="f${p.id}" name="category_id" class="form-select form-select-sm">
${catsOpt}
</select>
</td>
<td><input form="f${p.id}" name="name" value="${p.name}" class="form-control form-control-sm"></td>
<td><input form="f${p.id}" name="price" type="number" value="${p.price}" class="form-control form-control-sm" style="width:90px"></td>
<td><input form="f${p.id}" name="stock" type="number" value="${p.stock}" class="form-control form-control-sm" style="width:90px"></td>
<td class="text-nowrap">
<form id="f${p.id}" onsubmit="return postForm(this)">
<input type="hidden" name="_csrf" value="${csrf}">
<button class="btn btn-sm btn-success">💾</button>
</form>
<form onsubmit="return postForm(this)">
<input type="hidden" name="_csrf" value="${csrf}">
<button class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить товар?')">✕</button>
</form>
</td>
</tr>`).join("");
  return `
<h4>🛒 Товары</h4>
<form onsubmit="return postForm(this)" class="row g-2 mb-4">
<input type="hidden" name="_csrf" value="${csrf}">
<div class="col-md-3"><select name="category_id" class="form-select">${catsOpt}</select></div>
<div class="col-md-4"><input name="name" class="form-control" placeholder="Название" required></div>
<div class="col-md-2"><input name="price" type="number" class="form-control" placeholder="Цена ⭐" required></div>
<div class="col-md-2"><input name="stock" type="number" class="form-control" placeholder="Остаток" value="999"></div>
<div class="col-md-1"><button class="btn btn-success w-100">+</button></div>
</form>
<div class="table-responsive">
<table class="table table-sm align-middle">
<tr><th>ID</th><th>Категория</th><th>Название</th><th>Цена ⭐</th><th>Остаток</th><th></th></tr>
${rowsHtml}
</table>
</div>`;
}
function tmplCoupons(rows, csrf){
  const rowsHtml = rows.map(c=>`
<tr>
<td><code>${c.code}</code></td>
<td>${c.amount}⭐</td>
<td>${c.uses_left}</td>
<td>${c.used}</td>
<td>
<form onsubmit="return postForm(this)">
<input type="hidden" name="_csrf" value="${csrf}">
<button class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить купон?')">Удалить</button>
</form>
</td>
</tr>`).join("");
  return `
<h4>🎟 Купоны</h4>
<form onsubmit="return postForm(this)" class="row g-2 mb-4">
<input type="hidden" name="_csrf" value="${csrf}">
<div class="col-md-3"><input name="code" class="form-control" placeholder="Код" required></div>
<div class="col-md-3"><input name="amount" type="number" class="form-control" placeholder="Сумма ⭐" required></div>
<div class="col-md-3"><input name="uses" type="number" class="form-control" placeholder="Кол-во активаций" required></div>
<div class="col-md-3"><button class="btn btn-success">Создать / обновить</button></div>
</form>
<table class="table align-middle">
<tr><th>Код</th><th>Сумма</th><th>Осталось</th><th>Активировано</th><th></th></tr>
${rowsHtml}
</table>`;
}
function tmplTopups(rows){
  const rowsHtml = rows.map(t=>`
<tr>
<td>${t.id}</td>
<td><a href="#/users/${t.user_id}">${t.name || t.user_id}</a></td>
<td>+${t.amount}⭐</td>
<td>${t.date}</td>
</tr>`).join("");
  return `
<h4>💰 История пополнений</h4>
<table class="table table-sm">
<tr><th>#</th><th>Пользователь</th><th>Сумма</th><th>Дата</th></tr>
${rowsHtml}
</table>`;
}
function tmplBroadcast(total, result){
  return `
<h4>📢 Рассылка</h4>
<p class="text-secondary">Получателей: ${total}</p>
${result ? `<div class="alert alert-success">${result}</div>` : ""}
<form onsubmit="return postForm(this)">
<input type="hidden" name="_csrf" value="${csrfToken()}">
<textarea name="text" rows="6" class="form-control mb-3" placeholder="Текст сообщения" required></textarea>
<button class="btn btn-success">Отправить всем</button>
</form>`;
}
function tmplSettings(items, csrf){
  const body = items.map(([k,label,val])=>`
<div class="mb-3">
<label class="form-label">${label}</label>
${k==='greeting'||k==='service_text'
  ? `<textarea name="${k}" rows="3" class="form-control">${val}</textarea>`
  : `<input name="${k}" value="${val}" class="form-control">`}
</div>`).join("");
  return `
<h4>⚙️ Настройки бота</h4>
<form onsubmit="return postForm(this)" style="max-width:700px">
<input type="hidden" name="_csrf" value="${csrf}">
${body}
<button class="btn btn-success">Сохранить</button>
</form>`;
}

/* ---------- загрузка страниц ---------- */
async function load(path){
  try{
    const r = await fetch(API_BASE + path, { headers:{ "X-Requested-With":"XMLHttpRequest" } });
    if(!r.ok){
      if(r.status === 401){ show("login"); return; }
      throw new Error("HTTP " + r.status);
    }
    const j = await r.json();
    if(j && j.redirect){ location.href = j.redirect; return; }
    const csrf = csrfToken();
    document.getElementById("content").innerHTML = j.html;
    if(j.csrf) document.cookie = "_csrf=" + j.csrf + "; path=/";
  }catch(e){
    flash("Ошибка загрузки: " + e.message, "danger");
    show("login");
  }
}
function show(name){
  const map = {
    login: tmplLogin(csrfToken()),
    index: tmplIndex,
    users: tmplUsers,
    user: tmplUser,
    orders: tmplOrders,
    categories: tmplCategories,
    products: tmplProducts,
    coupons: tmplCoupons,
    topups: tmplTopups,
    broadcast: tmplBroadcast,
    settings: tmplSettings
  };
  const template = map[name];
  if(!template){ flash("Страница не найдена", "danger"); return; }
  document.getElementById("content").innerHTML = template();
}

window.addEventListener("hashchange", ()=>{
  const h = location.hash.replace(/^#\/?/,"") || "/";
  const [name, id] = h.split("/").filter(Boolean).concat([""]);
  if(name === "users" && id){
    load("/users/" + id);
  }else if(name === "orders" && id && id.endsWith("/done"^0)===(id.endsWith("/done")&&Number.isInteger(+id.split("/")[0]))==false){}
  else if(name === "orders"){
    load("/orders" + (location.search||""));
  }else if(name === "login"){
    show("login");
  }else if(name === "categories"){
    load("/categories");
  }else if(name === "products"){
    load("/products");
  }else if(name === "coupons"){
    load("/coupons");
  }else if(name === "topups"){
    load("/topups");
  }else if(name === "broadcast"){
    load("/broadcast");
  }else if(name === "settings"){
    load("/settings");
  }else if(name === "users"){
    load("/users");
  }else{
    load("/");
  }
});

/* ---------- начальная загрузка ---------- */
(async()=>{
  if(location.hash){
    window.dispatchEvent(new HashChangeEvent("hashchange"));
  }else{
    load("/");
  }
})();
</script>
</body>
</html>
